<script>
const _edit = window.location.pathname;

if (typeof XMLHttpRequest === "undefined") {
  XMLHttpRequest = function () {
    try { return new ActiveXObject("Msxml2.XMLHTTP.6.0"); } catch (e) {}
    try { return new ActiveXObject("Msxml2.XMLHTTP.3.0"); } catch (e) {}
    try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
    throw new Error("This browser does not support XMLHttpRequest.");
  };
}
function ge(a){
  return document.getElementById(a);
}
function ce(a){
  return document.createElement(a);
}
function sortByKey(array, key) {
  return array.sort((a, b)=>{
    return ((a[key] < b[key]) ? -1 : ((a[key] > b[key]) ? 1 : 0));
  });
}

var QueuedRequester = function () {
  this.queue = [];
  this.running = false;
  this.xmlhttp = null;
}
QueuedRequester.prototype = {
  _request: function(req){
    this.running = true;
    if(!req instanceof Object) return;
    var that = this;

    ge("loader").style.display = "block";

    var p = "";
    if(req.params instanceof FormData){
      p = req.params;
    } else if(req.params instanceof Object){
      for (var key in req.params) {
        if(p === "")
          p += (req.method === "GET")?"?":"";
        else
          p += "&";
        p += encodeURIComponent(key)+"="+encodeURIComponent(req.params[key]);
      };
    }

    this.xmlhttp = new XMLHttpRequest();
    this.xmlhttp.onreadystatechange = (e)=>{
      if (this.xmlhttp.readyState == 4){
        ge("loader").style.display = "none";
        req.callback(this.xmlhttp.status, this.xmlhttp.responseText);
        if(that.queue.length === 0) that.running = false;
        if(that.running) that._request(that.queue.shift());
      }
    };

    if(req.method === "GET"){
      this.xmlhttp.open(req.method, req.url+p, true);
      this.xmlhttp.send();
    } else {
      this.xmlhttp.open(req.method, req.url, true);
      if(p instanceof String)
        this.xmlhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
      this.xmlhttp.send(p);
    }
  },
  stop: function(){
    if(this.running) this.running = false;
    if(this.xmlhttp && this.xmlhttp.readyState < 4){
      this.xmlhttp.abort();
    }
  },
  add: function(method, url, params, callback){
    this.queue.push({url:url,method:method,params:params,callback:callback});
    if(!this.running){
      this._request(this.queue.shift());
    }
  }
}

var requests = new QueuedRequester();

function createFileUploader(element, tree, editor){
  var xmlHttp;
  var back = ce("button");
  back.innerHTML = '&#9204;'; // alt &#x1F519;
  ge(element).appendChild(back);
  var refresh = ce("button");
  refresh.innerHTML = '&#8635;';
  ge(element).appendChild(refresh);
  var input = ce("input");
  input.type = "file";
  input.multiple = false;
  input.name = "data";
  input.id="upload-select";
  ge(element).appendChild(input);
  var path = ce("input");
  path.id = "upload-path";
  path.type = "text";
  path.name = "path";
  path.defaultValue = "/";
  ge(element).appendChild(path);
  var button = ce("button");
  button.innerHTML = 'Upload';
  ge(element).appendChild(button);
  var mkfile = ce("button");
  mkfile.innerHTML = 'Create';
  ge(element).appendChild(mkfile);
  var filename = ce("input");
  filename.id = "editor-filename";
  filename.type = "text";
  filename.disabled = true;
  filename.size = 20;
  ge(element).appendChild(filename);

  var savefile = ce("button");
  savefile.innerHTML = 'Save' ;
  ge(element).appendChild(savefile);

  function createPath(p){
    var formData = new FormData();
    formData.append("path", p);
    requests.add("PUT", _edit, formData, (s,r)=>{
      if (s != 200) alert("ERROR["+s+"]: "+r);
      else tree.refreshPath();
    });
  }

  back.onclick = (e)=>{ window.location.href="../"; }

  mkfile.onclick = (e)=>{
    if(path.value.indexOf(".") === -1) return;
    createPath(path.value);
    editor.loadUrl(path.value);
    path.value="/";
  };

  savefile.onclick = (e)=>{
    editor.execCommand('saveCommand');
  };

  refresh.onclick = (e)=>{
    tree.refreshPath();
  };

  button.onclick = (e)=>{
    if(input.files.length === 0){
      return;
    }
    var formData = new FormData();
    formData.append("data", input.files[0], path.value);
    requests.add("POST", _edit, formData, (s,r)=>{
      if (s != 200) alert("ERROR["+s+"]: "+r);
      else tree.refreshPath();
    });
    var uploadPath= ge("upload-path");
    uploadPath.value="/";
    var uploadSelect= ge("upload-select");
    uploadSelect.value="";
  };
  input.onchange = (e)=>{
    if(input.files.length === 0) return;
    var filename = input.files[0].name;
    var ext = /(?:\.([^.]+))?$/.exec(filename)[1];
    var name = /(.*)\.[^.]+$/.exec(filename)[1];
    if(typeof name !== undefined){
      filename = name;
    }
    path.value = "/"+filename+"."+ext;
  };
}

function createTree(element, editor){
  var preview = ge("preview");
  var treeRoot = ce("div");
  treeRoot.className = "tvu";
  ge(element).appendChild(treeRoot);

  function loadDownload(path){
    ge('download-frame').src = _edit+"?download="+path;
  }

  function loadPreview(path){
    var edfname = ge("editor-filename");
    edfname.value=path;
    ge("editor").style.display = "none";
    preview.style.display = "block";
    preview.innerHTML = '<img src="'+_edit+'?edit='+path+'&_cb='+Date.now()+'" style="max-width:100%; max-height:100%; margin:auto; display:block;" />';
  }

  function fillFileMenu(el, path){
    var list = ce("ul");
    el.appendChild(list);
    var action = ce("li");
    list.appendChild(action);
    if(isImageFile(path)){
      action.innerHTML = "<span>Preview</span>";
      action.onclick = (e)=>{
        loadPreview(path);
        rmContextMenu();
      };
    } else if(isTextFile(path)){
      action.innerHTML = "<span>Edit</span>";
      action.onclick = (e)=>{
        editor.loadUrl(path);
        rmContextMenu();
      };
    }
    var download = ce("li");
    list.appendChild(download);
    download.innerHTML = "<span>Download</span>";
    download.onclick = (e)=>{
      loadDownload(path);
      rmContextMenu();
    };
    var delFile = ce("li");
    list.appendChild(delFile);
    delFile.innerHTML = "<span>Delete</span>";
    delFile.onclick = (e)=>{
      httpDelete(path);
      rmContextMenu();
    };
  }

  function rmContextMenu() {
    Array.from(document.body.getElementsByClassName('cm')).forEach((e)=>document.body.removeChild(e));
  }

  function showContextMenu(event, path, isfile){
    rmContextMenu();
    var divContext = ce("div");
    var scrollTop = document.body.scrollTop ? document.body.scrollTop : document.documentElement.scrollTop;
    var scrollLeft = document.body.scrollLeft ? document.body.scrollLeft : document.documentElement.scrollLeft;
    var left = event.clientX + scrollLeft;
    var top = event.clientY + scrollTop;
    divContext.className = 'cm';
    divContext.style.display = 'block';
    divContext.style.left = left + 'px';
    divContext.style.top = top + 'px';
    fillFileMenu(divContext, path);
    document.body.appendChild(divContext);
    var width = divContext.offsetWidth;
    var height = divContext.offsetHeight;
    divContext.onmouseout = (e)=>{
      if(e.clientX < left || e.clientX > (left + width) || e.clientY < top || e.clientY > (top + height)){
        rmContextMenu();
      }
    };
  }

  function createTreeLeaf(path, name, size){
    var leaf = ce("li");
    leaf.id = name;
    var label = ce("span");
    label.innerHTML = name;
    leaf.appendChild(label);
    leaf.onclick = (e)=>{
      if(isTextFile(leaf.id.toLowerCase())){
        editor.loadUrl(leaf.id);
      } else if(isImageFile(leaf.id.toLowerCase())){
        loadPreview(leaf.id);
      }
    };
    leaf.oncontextmenu = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      showContextMenu(e, leaf.id, true);
    };
    return leaf;
  }

  function addList(parent, path, items){
    sortByKey(items, 'name');
    var list = ce("ul");
    parent.appendChild(list);
    var ll = items.length;
    for(var i = 0; i < ll; i++){
      if(items[i].type === "file" && items[i].name.substring(0,1)!==".")
        list.appendChild(createTreeLeaf(path, items[i].name, items[i].size));
    }

  }

  function isTextFile(path){
    return /\.(txt|htm|html|js|css|xml|json|conf|ini|h|c|cpp|pxp|hex|ino|pde|wled|log)?$/i.test(path);
  }

  function isImageFile(path){
    return /\.(png|jpg|jpeg|gif|bmp|webp)?$/i.test(path)
  }

  this.refreshPath = ()=>{
    treeRoot.removeChild(treeRoot.childNodes[0]);
    httpGet(treeRoot, "/");
  };

  function httpDelete(filename){
    if (!confirm("Delete?\n"+filename)) return;
    var formData = new FormData();
    formData.append("path", filename);
    requests.add("DELETE", _edit, formData, (s, r)=>{
      if (s!=200) alert("ERROR["+s+"]: "+r);
      else {
        treeRoot.removeChild(treeRoot.childNodes[0]);
        httpGet(treeRoot, "/");
      }
    });
  }

  function httpGet(parent, path){
    requests.add("GET", _edit, { list: path }, (s, r)=>{
      if (s==200) addList(parent, path, JSON.parse(r));
    } );
  }

  httpGet(treeRoot, "/");
  return this;
}

function createEditor(element, file, lang, theme, type){
  function getLangFromFilename(filename){
    var ext = /(?:\.([^.]+))?$/.exec(filename)[1];
    if(typeof ext !== undefined){
      switch(ext){
        case "htm": return "html";
        case "js": return "javascript";
        case "h":
        case "c":
        case "cpp": return "c_cpp";
        case "css":
        case "scss":
        case "php":
        case "html":
        case "json":
        case "xml":
        case "ini": return ext;
      }
    }
    return "plain";
  }

  if(typeof file === "undefined") file = "/index.htm";

  if(typeof lang === "undefined"){
    lang = getLangFromFilename(file);
  }

  if(typeof theme === "undefined") theme = "textmate";

  if(typeof type === "undefined"){
    type = "text/"+(lang === "c_cpp" ? "plain" : lang);
  }

  var editor = ace.edit(element);
  function httpPost(filename, data, type){
    if (/json/i.test(type)) try { data = JSON.stringify(JSON.parse(data)); } catch (e) { if (!confirm("Error in JSON.\nSave?\n\n"+e)) return; }
    var formData = new FormData();
    formData.append("data", new Blob([data], { type: type }), filename);
    requests.add("POST", _edit, formData, (s,r)=>{
      if (s != 200) alert("ERROR["+s+"]: "+r);
    });
  }
  function pJ(json){ // prettyJson
    try {
      let obj = JSON.parse(json);
      // ignore 2d-gapfile (print as-is)
      if (Array.isArray(obj) && Math.max(...obj) <= 1 && Math.min(...obj) >= -1) return json;
      // if not a ledmap just pretty normally
      if (!obj.map || !Array.isArray(obj.map)) return JSON.stringify(obj, null, 2);
      // process ledmap (organise by width and height)
      const isSparse = Array.isArray(obj.map[0]); // is it a sparse ledmap?
      const len = obj.map.length;
      const width = obj.width || len;
      const digits = Math.max(...obj.map.flat().map(n => String(n).length)); // max # of digits in an element
      let rows = [];
      let i = 0;
      while (i < len) {
        const arr = isSparse ? obj.map[i] : obj.map.slice(i, i+width);
        i += isSparse ? 1 : width;
        rows.push("    "+(isSparse?'[':'')+arr.map(n => String(n).padStart(digits,' ')).join(', ')+(isSparse?']':'')+(i<len?',':''));
      }
      delete obj.map;
      let pretty = JSON.stringify(obj, null, 2).replace(/\s}$/, ',\n');
      pretty += [ "  \"map\": [", ...rows, "  ]" ].join("\n") + "\n}\n";
      return pretty;
    } catch (e) {
      return json;
    }
  }
  function httpGet(theUrl){
    requests.add("GET", _edit, { edit: theUrl }, (s, r)=>{
      ge("preview").style.display = "none";
      ge("editor").style.display = "block";
      if (s == 200) editor.setValue(pJ(r));
      else editor.setValue("");
      editor.clearSelection();
    });
  }

  if(lang !== "plain") editor.getSession().setMode("ace/mode/"+lang);
  editor.setTheme("ace/theme/"+theme);
  editor.$blockScrolling = Infinity;
  editor.getSession().setUseSoftTabs(true);
  editor.getSession().setTabSize(2);
  editor.setHighlightActiveLine(true);
  editor.setShowPrintMargin(false);
  editor.commands.addCommand({
      name: 'saveCommand',
      bindKey: {win: 'Ctrl-S',  mac: 'Command-S'},
      exec: function(editor) {
        httpPost(file, editor.getValue()+"", type);
      },
      readOnly: false
  });
  editor.commands.addCommand({
      name: 'undoCommand',
      bindKey: {win: 'Ctrl-Z',  mac: 'Command-Z'},
      exec: function(editor) {
        editor.getSession().getUndoManager().undo(false);
      },
      readOnly: false
  });
  editor.commands.addCommand({
      name: 'redoCommand',
      bindKey: {win: 'Ctrl-Shift-Z',  mac: 'Command-Shift-Z'},
      exec: function(editor) {
        editor.getSession().getUndoManager().redo(false);
      },
      readOnly: false
  });
  editor.loadUrl = (filename)=>{
    var edfname = ge("editor-filename");
    edfname.value=filename;
    file = filename;
    lang = getLangFromFilename(file);
    type = "text/"+lang;
    if(lang !== "plain") editor.getSession().setMode("ace/mode/"+lang);
    httpGet(file);
  };
  return editor;
}
function onBodyLoad(){
  var vars = {};
  //var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, (m,key,value)=>{ vars[key] = value; });
  var editor = createEditor("editor", vars.file, vars.lang, vars.theme);
  var tree = createTree("tree", editor);
  createFileUploader("uploader", tree, editor);
  if(typeof vars.file === "undefined") vars.file = "/index.htm";
  editor.loadUrl(vars.file);
};
</script>
